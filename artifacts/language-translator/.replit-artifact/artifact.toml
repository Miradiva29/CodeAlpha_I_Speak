kind = "web"
previewPath = "/"
title = "Language Translation Tool"
description = "A beginner-friendly translation tool for an AI internship project. Users can enter text, choose source and target languages, translate with a real translation API, and copy the result."
version = "1.0.0"
id = "artifacts/language-translator"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19621

[services.development]
run = "pnpm --filter @workspace/language-translator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/language-translator", "run", "build" ]
serve = "static"
publicDir = "artifacts/language-translator/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19621"
BASE_PATH = "/"
